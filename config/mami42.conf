# mami42 (nice!nano v2 / nRF52840) 用設定
# 有線(USB)・無線(BLE)両対応、バッテリー駆動を想定

# ZMK Studio でのキーマップ編集を有効化
CONFIG_ZMK_STUDIO=y
# ロック機能を無効化(接続すればすぐに編集可能。unlockキー不要)
CONFIG_ZMK_STUDIO_LOCKING=n

# 未使用時はディープスリープでバッテリーを節約
CONFIG_ZMK_SLEEP=y

# コンボ機能
CONFIG_ZMK_COMBO_MAX_KEYS_PER_COMBO=4
CONFIG_ZMK_COMBO_MAX_COMBOS_PER_KEY=4

# RGBアンダーグロー(per-key、L1〜L42、P0.06/SPI3経由)
CONFIG_ZMK_RGB_UNDERGLOW=y
